plugins {
    id 'java'
}

group = 'org.esperware.ghidramcp'
version = '0.2.0'

def ghidraInstallDir = providers.gradleProperty('GHIDRA_INSTALL_DIR')
        .orElse(providers.environmentVariable('GHIDRA_INSTALL_DIR'))
        .orNull

if (!ghidraInstallDir) {
    def localGhidra = file('.local/ghidra_12.2_PUBLIC')
    if (localGhidra.isDirectory()) {
        ghidraInstallDir = localGhidra.absolutePath
    }
}

if (!ghidraInstallDir) {
    throw new GradleException('Set GHIDRA_INSTALL_DIR to a Ghidra 12.2 installation directory.')
}

def ghidraHome = file(ghidraInstallDir)
if (!new File(ghidraHome, 'Ghidra').isDirectory()) {
    throw new GradleException("GHIDRA_INSTALL_DIR does not contain Ghidra/: ${ghidraHome}")
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly fileTree(dir: new File(ghidraHome, 'Ghidra'), includes: ['**/*.jar'])
    implementation 'io.modelcontextprotocol.sdk:mcp:2.1.0'
    implementation 'org.eclipse.jetty:jetty-server:12.0.18'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.0.18'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly fileTree(dir: new File(ghidraHome, 'Ghidra'), includes: ['**/*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform {
        excludeTags 'e2e'
    }
}

tasks.register('e2eTest', Test) {
    description = 'Runs end-to-end headless Ghidra MCP tests (default mode=docker).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'e2e'
    }
    dependsOn 'stageServer'
    systemProperty 'e2e.mode', System.getProperty('e2e.mode', 'docker')
    systemProperty 'e2e.engine', System.getProperty('e2e.engine', 'podman')
    systemProperty 'e2e.image', System.getProperty('e2e.image', 'ghidra-mcp:local')
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

tasks.named('jar', Jar) {
    exclude 'org/esperware/ghidramcp/Bootstrap*'
}

tasks.register('bootstrapJar', Jar) {
    archiveFileName = 'bootstrap.jar'
    destinationDirectory = layout.buildDirectory.dir('server')
    from(sourceSets.main.output) {
        include 'org/esperware/ghidramcp/Bootstrap*'
    }
}

tasks.register('stageServer', Sync) {
    dependsOn tasks.jar, tasks.bootstrapJar
    into layout.buildDirectory.dir('server/lib')
    from(tasks.jar)
    from(configurations.runtimeClasspath)
}
